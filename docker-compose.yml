services:
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8081:81"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_b
      - app_c
    networks:
      - public_net
      - private_net

  app_b:
    build: ./app_b
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
    depends_on:
      - db
    networks:
      - private_net

  app_c:
    build: ./app_c
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
    depends_on:
      - db
    networks:
      - private_net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 3s
      retries: 5
      start_period: 30s

volumes:
  db_data:

networks:
  public_net:
  private_net:
